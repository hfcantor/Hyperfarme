name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: System dependencies (FFmpeg, espeak-ng)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng
      - name: Install packages
        run: npm ci
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
      - name: Environment check
        run: npx hfr doctor
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
